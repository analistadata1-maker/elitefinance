<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Financiero — Elite Nutrition</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap');
  :root{--bg:#0b0f1a;--bg2:#111827;--bg3:#1a2235;--bg4:#1e2d40;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--text:#e8edf5;--text2:#8a9bbf;--text3:#4a5a7a;--green:#00c896;--red:#ff4d6d;--amber:#f59e0b;--blue:#3b82f6;--purple:#8b5cf6;--teal:#14b8a6;--coral:#f97316;--pink:#ec4899;--r:12px;--rs:8px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
  .header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:62px;position:sticky;top:0;z-index:100}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;background:linear-gradient(135deg,#00c896,#0077b6);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#fff;letter-spacing:.5px;flex-shrink:0}
  .btext h1{font-size:15px;font-weight:600;color:var(--text)}
  .btext p{font-size:11px;color:var(--text2);margin-top:1px}
  .hright{display:flex;align-items:center;gap:14px}
  .rinfo{font-size:11px;color:var(--text3)}.rinfo span{color:var(--green);font-weight:500}
  .rbtn{background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:7px 14px;border-radius:var(--rs);cursor:pointer;font-size:12px;font-family:inherit;transition:background .2s}
  .rbtn:hover{background:var(--bg4)}
  .sdot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);display:inline-block;animation:pulse 2s infinite}
  .sdot.loading{background:var(--amber);box-shadow:0 0 6px var(--amber)}
  .sdot.error{background:var(--red);box-shadow:0 0 6px var(--red);animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .cbar{height:2px;background:var(--border);position:fixed;top:62px;left:0;right:0;z-index:99}
  .cfill{height:100%;background:var(--green);box-shadow:0 0 6px var(--green);transition:width .5s linear}
  .container{padding:20px 28px;max-width:1600px;margin:0 auto}
  .sec{font-size:10px;font-weight:600;letter-spacing:1.2px;color:var(--text3);text-transform:uppercase;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
  .sec::after{content:'';flex:1;height:1px;background:var(--border)}
  .g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:1200px){.g5{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:768px){.g5,.g4,.g3,.g2{grid-template-columns:1fr 1fr}}
  @media(max-width:480px){.g5,.g4,.g3,.g2{grid-template-columns:1fr}}
  .mc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;transition:border-color .2s}
  .mc:hover{border-color:var(--border2)}
  .mc .lb{font-size:10px;color:var(--text2);font-weight:500;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;line-height:1.4}
  .mc .vl{font-size:21px;font-weight:600;line-height:1.1}
  .mc .sb{font-size:10px;color:var(--text3);margin-top:4px}
  .mc .al{height:2px;border-radius:1px;margin-top:10px}
  .mc.pos .vl{color:var(--green)}.mc.neg .vl{color:var(--red)}.mc.warn .vl{color:var(--amber)}.mc.blue .vl{color:var(--blue)}
  .kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px}
  .kpi .tr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
  .kpi .kn{font-size:10px;font-weight:600;letter-spacing:.5px;color:var(--text2);text-transform:uppercase}
  .kpi .kv{font-size:26px;font-weight:600;margin:6px 0 4px}
  .kpi .km{font-size:10px;color:var(--text3);line-height:1.6}
  .kpi .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.05);margin-top:10px}
  .kpi .fill{height:100%;border-radius:2px;transition:width .8s ease}
  .badge{font-size:9px;font-weight:600;padding:3px 8px;border-radius:20px;letter-spacing:.3px}
  .badge.g{background:rgba(0,200,150,.15);color:var(--green)}.badge.r{background:rgba(255,77,109,.15);color:var(--red)}.badge.a{background:rgba(245,158,11,.15);color:var(--amber)}
  .kpi.red .kv{color:var(--red)}.kpi.red .fill{background:var(--red)}
  .kpi.grn .kv{color:var(--green)}.kpi.grn .fill{background:var(--green)}
  .kpi.amb .kv{color:var(--amber)}.kpi.amb .fill{background:var(--amber)}
  .cc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:18px}
  .cc .ct{font-size:13px;font-weight:500;color:var(--text);margin-bottom:12px}
  .leg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .leg span{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text2)}
  .leg span b{width:8px;height:8px;border-radius:2px;display:inline-block;flex-shrink:0}
  .state-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;color:var(--text2);font-size:14px;text-align:center;gap:12px}
  .spinner{width:34px;height:34px;border:3px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ebox{background:rgba(255,77,109,.08);border:1px solid rgba(255,77,109,.2);border-radius:var(--r);padding:16px 20px;max-width:520px;font-size:12px;color:var(--text2);line-height:1.8}
  .divider{height:1px;background:var(--border);margin:24px 0}
  .pbadge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,200,150,.1);border:1px solid rgba(0,200,150,.2);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--green)}
  .footer{text-align:center;font-size:11px;color:var(--text3);padding:16px 28px 28px;border-top:1px solid var(--border);margin-top:28px}
</style>
</head>
<body>
<div class="cbar"><div class="cfill" id="cdown" style="width:100%"></div></div>
<div class="header">
  <div class="brand">
    <div class="logo">EN</div>
    <div class="btext">
      <h1>Dashboard Financiero — Elite Nutrition</h1>
      <p id="periodo">Conectando con Supabase...</p>
    </div>
  </div>
  <div class="hright">
    <span class="sdot loading" id="sdot"></span>
    <div class="rinfo">Próxima actualización: <span id="ctxt">—</span></div>
    <button class="rbtn" onclick="loadData(true)">↺ Actualizar ahora</button>
  </div>
</div>
<div class="container" id="main">
  <div class="state-screen"><div class="spinner"></div><div>Cargando datos desde Supabase...</div></div>
</div>
<div class="footer" id="footer" style="display:none">Elite Nutrition SAS &nbsp;|&nbsp; Fuente: Supabase — indicadores_gestion &nbsp;|&nbsp; Auto-refresh cada 5 minutos</div>

<script>
const SB  = 'https://kpqwwfianohqkdhshvnt.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtwcXd3Zmlhbm9ocWtkaHNodm50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4ODM3MzgsImV4cCI6MjA5MDQ1OTczOH0.LY1Etuqd4oQIOtdU-tzzh88tLsydh9Up8GCsODMa-vg';
const H   = {'apikey':KEY,'Authorization':'Bearer '+KEY,'Accept':'application/json'};
const REFRESH_MS = 5 * 60 * 1000;
let refreshTimer=null, countdownTimer=null, nextRefresh=null, charts=[];

async function fetchLastRow() {
  var controller = new AbortController();
  var timeout = setTimeout(function(){ controller.abort(); }, 10000);
  try {
    var url = SB+'/rest/v1/indicadores_gestion?order=created_at.desc&limit=1';
    var r = await fetch(url, {headers: H, signal: controller.signal});
    clearTimeout(timeout);
    if (!r.ok) {
      var body = await r.text();
      throw new Error('HTTP '+r.status+': '+body.slice(0,100));
    }
    var data = await r.json();
    if (!data.length) throw new Error('Sin registros en indicadores_gestion');
    return data[0];
  } catch(e) {
    clearTimeout(timeout);
    if (e.name === 'AbortError') throw new Error('Timeout: Supabase no respondio en 10s');
    throw e;
  }
}

function n(v){ return (v===null||v===undefined) ? 0 : Number(v); }
function fmt(v,d){
  d = d || 0;
  return new Intl.NumberFormat('es-CO',{maximumFractionDigits:d,minimumFractionDigits:d}).format(v);
}
function fmtM(v){
  var s = v<0 ? '-' : '';
  var a = Math.abs(v);
  if(a>=1e9) return s+'$'+fmt(a/1e9,2)+'B';
  if(a>=1e6) return s+'$'+fmt(a/1e6,1)+'M';
  if(a>=1e3) return s+'$'+fmt(a/1e3,0)+'K';
  return s+'$'+fmt(a,0);
}
function pw(v,mx){ return Math.min(Math.max(Math.abs(v)/mx*100,2),100).toFixed(1)+'%'; }
function destroyCharts(){ charts.forEach(function(c){try{c.destroy();}catch(e){}}); charts=[]; }

function render(d) {
  destroyCharts();

  var cartera     = n(d.cartera_por_cobrar);
  var dispCaja    = n(d.disponible_caja);
  var ingCaja     = n(d.ingresos_caja);
  var pagCaja     = n(d.pagos_caja);
  var dispBancos  = n(d.disponible_bancos);
  var ingBancos   = n(d.ingresos_bancos);
  var pagBancos   = n(d.pagos_bancos);
  var invMP       = n(d.inventario_productos_marca_propia_pesos);
  var invCom      = n(d.inventario_productos_comercializados_pesos);
  var invSouv     = n(d.inventario_souvenir_suministros_pesos);
  var cxpBienes   = n(d.cxp_proveedores_bienes);
  var cxpServ     = n(d.cxp_proveedores_servicios);
  var impPagar    = n(d.impuestos_por_pagar);
  var honorarios  = n(d.honorarios_por_pagar);
  var obligFin    = n(d.obligaciones_financieras);
  var provisiones = n(d.provisiones);
  var impRenta    = n(d.impuestos_renta_por_pagar);
  var sobreGiro   = n(d.sobregiro_tarjetas_credito);
  var obligLab    = n(d.obligaciones_laborales_por_pagar);
  var compraProd  = n(d.compra_productos);
  var compraIns   = n(d.compra_insumos);
  var gtoComercial= n(d.gasto_comercializacion);
  var gtoMkt      = n(d.gastos_marketing_mercadeo);
  var gtoLogistica= n(d.gastos_logistica);
  var gtoAdmin    = n(d.gastos_administrativos);
  var gtoFin      = n(d.gastos_financieros);
  var gtoImp      = n(d.gastos_impuestos);
  var fidMay      = n(d.fidelizacion_mayoristas);
  var vtasMay     = n(d.ventas_mayoristas_nuevos);
  var tat         = n(d.tat);
  var ecommerce   = n(d.ecommerce);
  var chatcenter  = n(d.chatcenter);
  var plataformas = n(d.plataformas);
  var dropship    = n(d.dropshipping);
  var redesSoc    = n(d.redes_sociales);
  var marcaPerso  = n(d.marca_personal);
  var intlUSA     = n(d.internacional_usa);
  var otrosPaises = n(d.otros_paises);
  var fidMin      = n(d.fidelizacion_minoristas);
  var camilaIA    = n(d.camila_ia);

  var inventario  = invMP + invCom + invSouv;
  var activoCte   = cartera + dispCaja + dispBancos + inventario;
  var pasivoCte   = cxpBienes + cxpServ + impPagar + honorarios + obligFin + provisiones + impRenta + sobreGiro + obligLab;
  var ingresosTot = fidMay + vtasMay + tat + ecommerce + chatcenter + plataformas + dropship + redesSoc + marcaPerso + intlUSA + otrosPaises + fidMin + camilaIA;
  var comprasTot  = compraProd + compraIns;
  var cxpTot      = cxpBienes + cxpServ;

  var razonCte  = pasivoCte>0 ? activoCte/pasivoCte : 0;
  var pruebaAc  = pasivoCte>0 ? (activoCte-inventario)/pasivoCte : 0;
  var rotInvV   = inventario>0 ? comprasTot/inventario : 0;
  var rotInvD   = rotInvV>0 ? 365/rotInvV : 0;
  var rotCartV  = cartera>0 ? ingresosTot/cartera : 0;
  var rotCartD  = rotCartV>0 ? 365/rotCartV : 0;
  var rotProvV  = cxpTot>0 ? comprasTot/cxpTot : 0;
  var rotProvD  = rotProvV>0 ? 365/rotProvV : 0;
  var endeud    = activoCte>0 ? (pasivoCte/activoCte)*100 : 0;
  var ctn       = activoCte - pasivoCte;
  var pctCTN    = activoCte>0 ? (ctn/activoCte)*100 : 0;

  function cls(v,g,ok)    { return v>=g?'grn':v>=ok?'amb':'red'; }
  function clsI(v,g,ok)   { return v<=g?'grn':v<=ok?'amb':'red'; }
  function bdg(v,g,ok,lb) { return v>=g?['g',lb[0]]:v>=ok?['a',lb[1]]:['r',lb[2]]; }
  function bdgI(v,g,ok,lb){ return v<=g?['g',lb[0]]:v<=ok?['a',lb[1]]:['r',lb[2]]; }

  var rc_c  = cls(razonCte,1.5,1.0);  var rc_b  = bdg(razonCte,1.5,1.0,['Optimo','Aceptable','Critico']);
  var pa_c  = cls(pruebaAc,1.0,0.7);  var pa_b  = bdg(pruebaAc,1.0,0.7,['Optimo','Aceptable','Critico']);
  var ri_c  = clsI(rotInvD,90,180);   var ri_b  = bdgI(rotInvD,90,180,['Rapido','Moderado','Lento']);
  var rca_c = clsI(rotCartD,30,60);   var rca_b = bdgI(rotCartD,30,60,['Agil','Normal','Lento']);
  var en_c  = clsI(endeud,60,100);    var en_b  = bdgI(endeud,60,100,['Bajo','Moderado','Alto']);
  var ctn_c = ctn>=0?'grn':'red';     var ctn_b = ctn>=0?['g','Positivo']:['r','Negativo'];
  var rp_c  = clsI(rotProvD,60,120);  var rp_b  = bdgI(rotProvD,60,120,['Optimo','Normal','Alto']);

  var canalesRaw = [
    {l:'Mayoristas nuevos', v:vtasMay,    c:'#3b82f6'},
    {l:'Fidel. Mayoristas', v:fidMay,     c:'#00c896'},
    {l:'Ecommerce',         v:ecommerce,  c:'#8b5cf6'},
    {l:'Chatcenter',        v:chatcenter, c:'#f59e0b'},
    {l:'TAT',               v:tat,        c:'#14b8a6'},
    {l:'Fidel. Minoristas', v:fidMin,     c:'#f97316'},
    {l:'Plataformas',       v:plataformas,c:'#ec4899'},
    {l:'Dropshipping',      v:dropship,   c:'#a78bfa'},
    {l:'Redes Sociales',    v:redesSoc,   c:'#34d399'},
    {l:'Internacional USA', v:intlUSA,    c:'#60a5fa'},
    {l:'Otros paises',      v:otrosPaises,c:'#9ca3af'},
    {l:'Marca personal',    v:marcaPerso, c:'#fbbf24'},
    {l:'Camila IA',         v:camilaIA,   c:'#2dd4bf'}
  ];
  var canales = canalesRaw.filter(function(x){ return x.v>0; }).sort(function(a,b){ return b.v-a.v; });

  function mc(cl,lb,vl,sb,ac){
    return '<div class="mc '+cl+'"><div class="lb">'+lb+'</div><div class="vl">'+vl+'</div>'+(sb?'<div class="sb">'+sb+'</div>':'')+'<div class="al" style="background:'+(ac||'transparent')+'"></div></div>';
  }
  function kcard(cl,kn,kv,km,bw,ba){
    return '<div class="kpi '+cl+'"><div class="tr"><div class="kn">'+kn+'</div><span class="badge '+ba[0]+'">'+ba[1]+'</span></div><div class="kv">'+kv+'</div><div class="km">'+km+'</div><div class="bar"><div class="fill" style="width:'+bw+'"></div></div></div>';
  }

  var html = '';
  html += '<div class="sec">Activos corrientes</div>';
  html += '<div class="g5">';
  html += mc('blue','Activo corriente total',fmtM(activoCte),'Cartera + Caja + Bancos + Inventario','#3b82f6');
  html += mc('','Cartera por cobrar',fmtM(cartera),'Rot. '+fmt(rotCartD,1)+' dias','#8b5cf6');
  html += mc('pos','Disponible en caja',fmtM(dispCaja),'Ingresos caja: '+fmtM(ingCaja),'#00c896');
  html += mc('pos','Disponible en bancos',fmtM(dispBancos),'Ingresos bancos: '+fmtM(ingBancos),'#00c896');
  html += mc('warn','Inventario total',fmtM(inventario),'MP '+fmtM(invMP)+' | Com. '+fmtM(invCom),'#f59e0b');
  html += '</div>';

  html += '<div class="sec">Pasivos corrientes</div>';
  html += '<div class="g5">';
  html += mc('neg','Pasivo corriente total',fmtM(pasivoCte),'Endeudamiento: '+fmt(endeud,1)+'%','#ff4d6d');
  html += mc('neg','Obligaciones financieras',fmtM(obligFin),'','#ff4d6d');
  html += mc('warn','CXP proveedores bienes',fmtM(cxpBienes),'Servicios: '+fmtM(cxpServ),'#f59e0b');
  html += mc('warn','Impuestos por pagar',fmtM(impPagar),'Renta: '+fmtM(impRenta),'#f59e0b');
  html += mc('warn','Honorarios + Provisiones',fmtM(honorarios+provisiones),'Oblig. lab: '+fmtM(obligLab),'#f59e0b');
  html += '</div>';

  html += '<div class="sec">Ingresos y egresos del periodo</div>';
  html += '<div class="g4">';
  html += mc('pos','Ingresos totales (canales)',fmtM(ingresosTot),canales.length+' canales activos','#00c896');
  html += mc('pos','Ingresos bancos (periodo)',fmtM(ingBancos),'Pagos bancos: '+fmtM(pagBancos),'#00c896');
  html += mc('neg','Pagos caja + bancos',fmtM(pagCaja+pagBancos),'Caja '+fmtM(pagCaja)+' | Bancos '+fmtM(pagBancos),'#ff4d6d');
  html += mc('warn','Compras totales',fmtM(comprasTot),'Prod. '+fmtM(compraProd)+' | Ins. '+fmtM(compraIns),'#f59e0b');
  html += '</div>';

  html += '<div class="sec">Gastos operativos</div>';
  html += '<div class="g5">';
  html += mc('warn','Administrativos',fmtM(gtoAdmin),'','#f97316');
  html += mc('warn','Marketing',fmtM(gtoMkt),'','#f97316');
  html += mc('warn','Logistica',fmtM(gtoLogistica),'','#f97316');
  html += mc('warn','Financieros',fmtM(gtoFin),'','#f97316');
  html += mc('warn','Comercializacion',fmtM(gtoComercial),'','#f97316');
  html += '</div>';

  html += '<div class="divider"></div>';
  html += '<div class="sec">KPI Financieros</div>';
  html += '<div class="g3">';
  html += kcard(rc_c,'Razon corriente',fmt(razonCte,2),'Activo '+fmtM(activoCte)+' / Pasivo '+fmtM(pasivoCte)+' | Meta >= 1.5',pw(razonCte,3),rc_b);
  html += kcard(pa_c,'Prueba acida',fmt(pruebaAc,2),'(Activo - Inventario) / Pasivo | Meta >= 1.0',pw(pruebaAc,2),pa_b);
  html += kcard(ctn_c,'Capital trabajo neto',fmtM(ctn),'% CTN: '+fmt(pctCTN,1)+'% | Activo - Pasivo corriente',pw(Math.abs(pctCTN),100),ctn_b);
  html += kcard(ri_c,'Rot. inventario',fmt(rotInvD,0)+' dias',fmt(rotInvV,2)+' veces | Compras '+fmtM(comprasTot)+' / Inv. '+fmtM(inventario)+' x 365',Math.min(rotInvD/365*100,100).toFixed(1)+'%',ri_b);
  html += kcard(rca_c,'Rot. cartera',fmt(rotCartD,1)+' dias',fmt(rotCartV,2)+' veces | Ingresos '+fmtM(ingresosTot)+' / Cartera '+fmtM(cartera)+' x 365',Math.min(rotCartD/90*100,100).toFixed(1)+'%',rca_b);
  html += kcard(en_c,'Endeudamiento cte.',fmt(endeud,1)+'%','Pasivo '+fmtM(pasivoCte)+' / Activo '+fmtM(activoCte)+' x 100 | Meta <= 60%',Math.min(endeud,100).toFixed(1)+'%',en_b);
  html += kcard(rp_c,'Rot. proveedores',fmt(rotProvD,0)+' dias',fmt(rotProvV,2)+' veces | Compras '+fmtM(comprasTot)+' / CXP '+fmtM(cxpTot)+' x 365',Math.min(rotProvD/365*100,100).toFixed(1)+'%',rp_b);
  html += '</div>';

  var legHTML = '';
  canales.forEach(function(c){ legHTML += '<span><b style="background:'+c.c+'"></b>'+c.l+' <strong style="color:#e8edf5">'+fmtM(c.v)+'</strong></span>'; });
  var chartH = Math.max(canales.length*38+50, 180);

  html += '<div class="sec">Analisis visual</div>';
  html += '<div class="cc" style="margin-bottom:10px"><div class="ct">Ingresos por canal de venta</div><div class="leg">'+legHTML+'</div><div style="position:relative;width:100%;height:'+chartH+'px"><canvas id="ch1"></canvas></div></div>';
  html += '<div class="g2" style="margin-bottom:10px">';
  html += '<div class="cc"><div class="ct">Composicion activo corriente</div><div style="position:relative;width:100%;height:220px"><canvas id="ch2"></canvas></div></div>';
  html += '<div class="cc"><div class="ct">Activo vs Pasivo vs CTN</div><div style="position:relative;width:100%;height:220px"><canvas id="ch3"></canvas></div></div>';
  html += '</div>';
  html += '<div class="g2">';
  html += '<div class="cc"><div class="ct">Gastos operativos</div><div style="position:relative;width:100%;height:220px"><canvas id="ch4"></canvas></div></div>';
  html += '<div class="cc"><div class="ct">Semaforo de liquidez</div><div id="sem" style="padding-top:4px"></div></div>';
  html += '</div>';

  document.getElementById('main').innerHTML = html;

  // Semaforo
  var colMap = {grn:'#00c896', amb:'#f59e0b', red:'#ff4d6d'};
  var semItems = [
    {l:'Razon corriente',   v:fmt(razonCte,2),     c:rc_c,  m:'meta >= 1.5'},
    {l:'Prueba acida',      v:fmt(pruebaAc,2),     c:pa_c,  m:'meta >= 1.0'},
    {l:'Endeudamiento',     v:fmt(endeud,1)+'%',   c:en_c,  m:'meta <= 60%'},
    {l:'Rot. inventario',   v:fmt(rotInvD,0)+' d', c:ri_c,  m:'meta <= 90d'},
    {l:'Rot. cartera',      v:fmt(rotCartD,1)+' d',c:rca_c, m:'meta <= 30d'},
    {l:'Rot. proveedores',  v:fmt(rotProvD,0)+' d',c:rp_c,  m:'meta <= 60d'},
    {l:'CTN',               v:fmtM(ctn),           c:ctn_c, m:'debe ser > 0'}
  ];
  var semHTML = '';
  semItems.forEach(function(s){
    semHTML += '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)">';
    semHTML += '<div style="display:flex;align-items:center;gap:8px">';
    semHTML += '<span style="width:8px;height:8px;border-radius:50%;background:'+colMap[s.c]+';box-shadow:0 0 5px '+colMap[s.c]+';flex-shrink:0"></span>';
    semHTML += '<span style="font-size:11px;color:#8a9bbf">'+s.l+'</span></div>';
    semHTML += '<div><span style="font-size:13px;font-weight:600;color:'+colMap[s.c]+'">'+s.v+'</span>';
    semHTML += '<span style="font-size:10px;color:#4a5a7a;margin-left:6px">'+s.m+'</span></div></div>';
  });
  document.getElementById('sem').innerHTML = semHTML;

  var GC = 'rgba(255,255,255,0.04)';
  var TC = '#4a5a7a';

  // Chart 1 - Canales
  try {
    var c1data = canales.length > 0 ? canales : [{l:'Sin datos',v:0,c:'#4a5a7a'}];
    charts.push(new Chart(document.getElementById('ch1'), {
      type: 'bar',
      data: {
        labels: c1data.map(function(c){ return c.l; }),
        datasets: [{
          data: c1data.map(function(c){ return +(c.v/1e6).toFixed(2); }),
          backgroundColor: c1data.map(function(c){ return c.c; }),
          borderRadius: 4,
          borderSkipped: false
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, indexAxis: 'y',
        plugins: { legend: {display:false}, tooltip: { callbacks: { label: function(ctx){ return ' $'+ctx.parsed.x.toFixed(2)+'M'; } } } },
        scales: {
          x: { ticks: { color:TC, font:{size:10}, callback: function(v){ return '$'+v+'M'; } }, grid: {color:GC}, border: {display:false} },
          y: { ticks: { color:'#8a9bbf', font:{size:11} }, grid: {display:false}, border: {display:false} }
        }
      }
    }));
  } catch(e){ console.warn('ch1:', e.message); }

  // Chart 2 - Doughnut activo
  try {
    charts.push(new Chart(document.getElementById('ch2'), {
      type: 'doughnut',
      data: {
        labels: ['Cartera','Caja','Bancos','Inventario'],
        datasets: [{ data: [cartera,dispCaja,dispBancos,inventario].map(function(v){ return +(v/1e6).toFixed(2); }), backgroundColor: ['#8b5cf6','#00c896','#3b82f6','#f59e0b'], borderWidth: 2, borderColor: '#111827' }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '65%',
        plugins: { legend: { display:true, position:'bottom', labels: { color:'#8a9bbf', font:{size:10}, boxWidth:10, padding:10 } }, tooltip: { callbacks: { label: function(ctx){ return ' $'+ctx.parsed.toFixed(1)+'M'; } } } }
      }
    }));
  } catch(e){ console.warn('ch2:', e.message); }

  // Chart 3 - Activo vs Pasivo
  try {
    var ctnColor = ctn >= 0 ? '#00c896' : '#ff4d6d';
    charts.push(new Chart(document.getElementById('ch3'), {
      type: 'bar',
      data: {
        labels: ['Activo cte.','Pasivo cte.','CTN'],
        datasets: [{ data: [+(activoCte/1e6).toFixed(2),+(pasivoCte/1e6).toFixed(2),+(ctn/1e6).toFixed(2)], backgroundColor: ['#3b82f6','#ff4d6d',ctnColor], borderRadius: 6, borderSkipped: false }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: {display:false}, tooltip: { callbacks: { label: function(ctx){ var v=ctx.parsed.y; return (v<0?'-':'')+'$'+Math.abs(v).toFixed(1)+'M'; } } } },
        scales: {
          x: { ticks: { color:TC, font:{size:11} }, grid: {display:false}, border: {display:false} },
          y: { ticks: { color:TC, font:{size:10}, callback: function(v){ return '$'+v+'M'; } }, grid: {color:GC}, border: {display:false} }
        }
      }
    }));
  } catch(e){ console.warn('ch3:', e.message); }

  // Chart 4 - Gastos
  try {
    var gdRaw = [
      {l:'Administrativos',v:gtoAdmin,   c:'#3b82f6'},
      {l:'Marketing',      v:gtoMkt,     c:'#f59e0b'},
      {l:'Logistica',      v:gtoLogistica,c:'#14b8a6'},
      {l:'Financieros',    v:gtoFin,     c:'#ff4d6d'},
      {l:'Comercializacion',v:gtoComercial,c:'#8b5cf6'},
      {l:'Impuestos',      v:gtoImp,     c:'#f97316'}
    ];
    var gd = gdRaw.filter(function(x){ return x.v>0; });
    var gdFinal = gd.length > 0 ? gd : [{l:'Sin datos',v:1,c:'#4a5a7a'}];
    charts.push(new Chart(document.getElementById('ch4'), {
      type: 'doughnut',
      data: {
        labels: gdFinal.map(function(x){ return x.l; }),
        datasets: [{ data: gdFinal.map(function(x){ return +(x.v/1e6).toFixed(2); }), backgroundColor: gdFinal.map(function(x){ return x.c; }), borderWidth: 2, borderColor: '#111827' }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '60%',
        plugins: { legend: { display:true, position:'bottom', labels: { color:'#8a9bbf', font:{size:10}, boxWidth:10, padding:8 } }, tooltip: { callbacks: { label: function(ctx){ return ' $'+ctx.parsed.toFixed(1)+'M'; } } } }
      }
    }));
  } catch(e){ console.warn('ch4:', e.message); }
}

function startCountdown(){
  clearInterval(countdownTimer);
  nextRefresh = Date.now() + REFRESH_MS;
  countdownTimer = setInterval(function(){
    var rem = Math.max(0, nextRefresh - Date.now());
    document.getElementById('cdown').style.width = (rem/REFRESH_MS*100).toFixed(1)+'%';
    var m = Math.floor(rem/60000);
    var s = Math.floor((rem%60000)/1000);
    document.getElementById('ctxt').textContent = m+':'+(s<10?'0':'')+s;
    if(rem<=0) clearInterval(countdownTimer);
  }, 500);
}

async function loadData(manual){
  var dot = document.getElementById('sdot');
  dot.className = 'sdot loading';
  if(manual){
    document.getElementById('main').innerHTML = '<div class="state-screen"><div class="spinner"></div><div>Actualizando datos...</div></div>';
  }
  try {
    var row = await fetchLastRow();
    var fi = row.fecha_inicio || '';
    var ff = row.fecha_final  || '';
    var ts = row.updated_at   || row.created_at || '';
    document.getElementById('periodo').innerHTML = '<span class="pbadge">Periodo: '+fi+' a '+ff+'</span> &nbsp; Actualizado: '+new Date(ts).toLocaleString('es-CO');
    render(row);
    document.getElementById('sdot').className = 'sdot';
    document.getElementById('footer').style.display = 'block';
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(function(){ loadData(false); }, REFRESH_MS);
    startCountdown();
  } catch(e) {
    document.getElementById('sdot').className = 'sdot error';
    document.getElementById('main').innerHTML = '<div class="state-screen"><div style="font-size:36px">Warning</div><strong style="color:#ff4d6d;font-size:16px">Error al cargar los datos</strong><div class="ebox"><strong>Causa:</strong> '+e.message+'</div><button onclick="loadData(true)" style="padding:10px 24px;background:#1a2235;border:1px solid rgba(255,255,255,.15);color:#e8edf5;border-radius:8px;cursor:pointer;font-size:13px;margin-top:8px">Reintentar</button></div>';
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(function(){ loadData(false); }, 30000);
  }
}

loadData(false);
</script>
